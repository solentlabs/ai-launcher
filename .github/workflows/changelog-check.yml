name: Changelog Verification

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - ".github/**"
      - "tests/**"

jobs:
  check-changelog:
    name: Verify CHANGELOG.md Updated
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The decision lives in scripts/gate_checks.py so the tests in
      # tests/test_gate_checks.py exercise the same code this gate runs. It used
      # to be inline bash, which nothing could test -- and it deadlocked the
      # v0.4.2 release by failing the release PR's version bump.
      - name: Verify changelog update
        run: |
          git fetch origin ${{ github.base_ref }}
          git diff --name-only origin/${{ github.base_ref }}...HEAD \
            | python3 scripts/gate_checks.py changelog --head-ref "${{ github.head_ref }}"

      - name: Comment on PR if changelog missing
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ⚠️ CHANGELOG.md Update Required

            This PR contains code changes but \`CHANGELOG.md\` has not been updated.

            Per [docs/releasing.md](../blob/main/docs/releasing.md), the changelog entry for the target version must land in the feature PR — the release script validates this before proceeding.

            Add a versioned entry:

            \`\`\`markdown
            ## [X.Y.Z] - YYYY-MM-DD

            ### Fixed
            - Short description of the change (#PR)
            \`\`\`

            Only include sections that apply (Added / Changed / Fixed / Removed).

            **Exemptions:** docs-only, test-only, CI-only, and tooling changes do not require a changelog entry.`
            });

      - name: Success
        if: success()
        run: |
          if [ "${{ steps.code_check.outputs.code_changed }}" == "true" ]; then
            echo "✅ CHANGELOG.md updated alongside code changes"
          else
            echo "✅ No code changes — changelog update not required"
          fi
