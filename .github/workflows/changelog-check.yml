name: Changelog Verification

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - ".github/**"
      - "tests/**"

permissions:
  contents: read

jobs:
  check-changelog:
    name: Verify CHANGELOG.md Updated
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # The decision lives in scripts/gate_checks.py so the tests in
      # tests/test_gate_checks.py exercise the same code this gate runs. It used
      # to be inline bash, which nothing could test -- and it deadlocked the
      # v0.4.2 release by failing the release PR's version bump.
      # Branch names are attacker-chosen: they reach the shell through env, never
      # by interpolation into the script (docs/releasing.md, "Workflow Safety").
      - name: Verify changelog update
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git fetch origin "$BASE_REF"
          git diff --name-only "origin/$BASE_REF...HEAD" \
            | python3 scripts/gate_checks.py changelog --head-ref "$HEAD_REF"

      - name: Comment on PR if changelog missing
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ⚠️ CHANGELOG.md Update Required

            This PR contains code changes but \`CHANGELOG.md\` has not been updated.

            Per [docs/releasing.md](../blob/main/docs/releasing.md), the changelog entry for the target version must land in the feature PR — the release script validates this before proceeding.

            Add a versioned entry:

            \`\`\`markdown
            ## [X.Y.Z] - YYYY-MM-DD

            ### Fixed
            - Short description of the change (#PR)
            \`\`\`

            Only include sections that apply (Added / Changed / Fixed / Removed).

            **Exemptions:** docs-only, test-only, CI-only, and tooling changes do not require a changelog entry.`
            });

      - name: Success
        if: success()
        run: echo "✅ Changelog check passed"
