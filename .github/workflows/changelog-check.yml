name: Changelog Verification

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - ".github/**"
      - "tests/**"

jobs:
  check-changelog:
    name: Verify CHANGELOG.md Updated
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if CHANGELOG.md was modified
        id: changelog_check
        run: |
          git fetch origin ${{ github.base_ref }}

          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q "^CHANGELOG.md$"; then
            echo "changelog_updated=true" >> $GITHUB_OUTPUT
            echo "✅ CHANGELOG.md has been updated"
          else
            echo "changelog_updated=false" >> $GITHUB_OUTPUT
            echo "⚠️ CHANGELOG.md has not been updated"
          fi

      - name: Check if code changes were made
        id: code_check
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD \
            | grep -qE "^(src/ai_launcher|scripts)/.*\.py$"; then
            echo "code_changed=true" >> $GITHUB_OUTPUT
            echo "Code changes detected"
          else
            echo "code_changed=false" >> $GITHUB_OUTPUT
            echo "No code changes detected"
          fi

      # Release PRs are exempt. scripts/release.py bumps the version constants in
      # pyproject.toml and src/ai_launcher/__init__.py -- which match the code
      # pattern above -- while the changelog entry for that version landed with
      # the feature PR, as docs/releasing.md requires. Without this exemption the
      # gate fails every release PR and deadlocks the release flow.
      - name: Verify changelog update
        if: >-
          steps.code_check.outputs.code_changed == 'true' &&
          steps.changelog_check.outputs.changelog_updated == 'false' &&
          !startsWith(github.head_ref, 'release/')
        run: |
          echo "❌ CHANGELOG.md needs to be updated!"
          echo ""
          echo "This PR contains code changes but CHANGELOG.md was not updated."
          echo "Add a ## [X.Y.Z] entry following the Keep a Changelog format."
          echo "See docs/releasing.md for the expected format."
          exit 1

      - name: Comment on PR if changelog missing
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ⚠️ CHANGELOG.md Update Required

            This PR contains code changes but \`CHANGELOG.md\` has not been updated.

            Per [docs/releasing.md](../blob/main/docs/releasing.md), the changelog entry for the target version must land in the feature PR — the release script validates this before proceeding.

            Add a versioned entry:

            \`\`\`markdown
            ## [X.Y.Z] - YYYY-MM-DD

            ### Fixed
            - Short description of the change (#PR)
            \`\`\`

            Only include sections that apply (Added / Changed / Fixed / Removed).

            **Exemptions:** docs-only, test-only, CI-only, and tooling changes do not require a changelog entry.`
            });

      - name: Success
        if: success()
        run: |
          if [ "${{ steps.code_check.outputs.code_changed }}" == "true" ]; then
            echo "✅ CHANGELOG.md updated alongside code changes"
          else
            echo "✅ No code changes — changelog update not required"
          fi
