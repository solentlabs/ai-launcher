name: Tag Protection

on:
  push:
    tags:
      - 'v*'

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        id: checkout
        continue-on-error: true
        with:
          fetch-depth: 0

      - name: Retry checkout on failure
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag is on main branch
        run: |
          TAG_COMMIT=$(git rev-parse HEAD)
          if ! git branch -r --contains "$TAG_COMMIT" | grep -q 'origin/main'; then
            echo "::error::Tag must be on the main branch"
            exit 1
          fi
          echo "✓ Tag is on main branch"

      # Waits out a pending CI rather than failing it. release.py can push the tag
      # within seconds of the merge, so CI on main is often still running when this
      # starts -- an unfinished check run has conclusion null, which the previous
      # inline jq collapsed to "failure". That raced the v0.4.2 release into a red
      # gate on a commit whose CI went on to pass.
      #
      # The status decision is scripts/gate_checks.py, covered by
      # tests/test_gate_checks.py, so this cannot silently diverge from its tests.
      - name: Validate CI passed on tagged commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMMIT=$(git rev-parse HEAD)
          DEADLINE=$(( SECONDS + 1800 ))

          while true; do
            # Deliberately not --paginate: combined with --jq it emits one JSON
            # document per page, which will not parse as a single payload.
            STATUS=$(gh api \
              "repos/${{ github.repository }}/commits/$COMMIT/check-runs?per_page=100" \
              | python3 scripts/gate_checks.py ci-status)

            case "$STATUS" in
              success)
                echo "✓ CI passed on tagged commit $COMMIT"
                exit 0
                ;;
              failure)
                echo "::error::CI failed on tagged commit $COMMIT — refusing to tag"
                exit 1
                ;;
            esac

            if [ "$SECONDS" -ge "$DEADLINE" ]; then
              echo "::error::Timed out after 30m waiting for CI on $COMMIT"
              exit 1
            fi
            echo "CI still pending on $COMMIT — waiting ($SECONDS s)"
            sleep 20
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate version consistency
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "Tag version: $TAG"

          # Check pyproject.toml
          PYPROJECT_VER=$(python3 -c "
          import re
          content = open('pyproject.toml').read()
          match = re.search(r'^version\s*=\s*\"([^\"]+)\"', content, re.MULTILINE)
          print(match.group(1) if match else 'NOT_FOUND')
          ")
          echo "pyproject.toml version: $PYPROJECT_VER"

          if [ "$PYPROJECT_VER" != "$TAG" ]; then
            echo "::error::pyproject.toml version ($PYPROJECT_VER) does not match tag ($TAG)"
            exit 1
          fi

          # Check __init__.py
          INIT_VER=$(python3 -c "
          import re
          content = open('src/ai_launcher/__init__.py').read()
          match = re.search(r'^__version__\s*=\s*\"([^\"]+)\"', content, re.MULTILINE)
          print(match.group(1) if match else 'NOT_FOUND')
          ")
          echo "__init__.py version: $INIT_VER"

          if [ "$INIT_VER" != "$TAG" ]; then
            echo "::error::__init__.py version ($INIT_VER) does not match tag ($TAG)"
            exit 1
          fi

          echo "✓ All versions match: $TAG"
